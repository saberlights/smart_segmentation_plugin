# 智能分段插件配置
# 使用分段模型把一条回复拆成多条连续消息

# 使用前必须在 config/bot_config.toml 中关闭 MaiBot 内置分段：
# [response_splitter]
# enable = false

# 基础设置
[plugin]

# 插件内部名称；保持默认值即可
name = "smart_segmentation_plugin"

# 配置文件版本；保持默认值即可
config_version = "1.2.0"

# 插件版本；保持默认值即可
version = "1.1.0"

# 是否启用插件；true 开启，false 关闭
enabled = true

# 智能分段设置
[segmentation]

# 是否启用智能分段；true 开启，false 关闭
enabled = true

# 分段使用的模型；填写任务名、模型名或模型标识，留空使用默认模型
model = "doubao1.6"

# 分段风格；填写 natural（自然）、conservative（少分段）或 active（多分段）
style = "natural"

# 触发分段的最小回复长度；填写正整数，短于此长度的回复不分段
min_length = 3

# 单次回复的最大分段数；填写正整数
max_segments = 16

# 分段模型温度；填写 0.1 至 0.5，推荐 0.3
temperature = 0.3

# 分段模型最大输出 token 数；填写正整数，推荐 600
max_tokens = 600

# 是否模拟打字等待；true 开启，false 关闭
typing_enabled = true
