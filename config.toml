[plugin]
name = "smart_segmentation_plugin"
config_version = "1.0.0"
enabled = true

[segmentation]
enabled = true
style = "natural"
model = "Deepseek-V4-Flash"
min_length = 8
max_segments = 8
delay_base = 0.35
delay_per_char = 0.015
delay_max = 1.2
temperature = 0.3
max_tokens = 600
llm_timeout_sec = 12.0
